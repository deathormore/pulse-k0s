apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-api
  namespace: pulse
spec:
  replicas: 2
  selector:
    matchLabels: { app: pulse-api }
  template:
    metadata:
      labels: { app: pulse-api, app.kubernetes.io/part-of: pulse }
    spec:
      containers:
        - name: api
          image: localhost/pulse:1.0.0
          imagePullPolicy: Never
          env:
            - { name: ROLE, value: api }
            - { name: DB_HOST, value: postgres }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 75m, memory: 96Mi }
            limits: { cpu: 400m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
  namespace: pulse
  labels: { app: pulse-api, app.kubernetes.io/part-of: pulse }
spec:
  type: NodePort
  selector: { app: pulse-api }
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels: { app: pulse-worker }
  template:
    metadata:
      labels: { app: pulse-worker, app.kubernetes.io/part-of: pulse }
    spec:
      containers:
        - name: worker
          image: localhost/pulse:1.0.0
          imagePullPolicy: Never
          env:
            - { name: ROLE, value: worker }
            - { name: DB_HOST, value: postgres }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          ports:
            - { name: metrics, containerPort: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-worker
  namespace: pulse
  labels: { app: pulse-worker, app.kubernetes.io/part-of: pulse }
spec:
  selector: { app: pulse-worker }
  ports:
    - { name: metrics, port: 3000, targetPort: metrics }
