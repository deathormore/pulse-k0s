apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: pulse
spec:
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
